name: Publish to Docker Hub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (e.g. 0.2.1)'
        required: true
        type: string

jobs:
  publish:
    name: Build and push (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
          GIT_REF: ${{ github.ref }}
        run: |
          if [ -n "$DISPATCH_TAG" ]; then
            echo "value=$DISPATCH_TAG" >> "$GITHUB_OUTPUT"
          else
            # ref is refs/tags/vX.Y.Z — strip prefix to get X.Y.Z
            echo "value=${GIT_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decide whether to also tag :latest
        id: stable
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          # Pre-releases include a "-" (e.g. 0.2.1-rc1); only stable releases get :latest
          if [[ "$VERSION" == *-* ]]; then
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose image tags
        id: tags
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          VERSION: ${{ steps.version.outputs.value }}
          IS_STABLE: ${{ steps.stable.outputs.is_stable }}
        run: |
          IMAGE="$DH_USER/apisec-cicd-latest-fetch"
          TAGS="$IMAGE:$VERSION"
          if [ "$IS_STABLE" = "true" ]; then
            TAGS="$TAGS"$'\n'"$IMAGE:latest"
          fi
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
