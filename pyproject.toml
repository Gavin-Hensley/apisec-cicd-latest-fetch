[project]
name = "apisec-cicd-latest-fetch"
version = "0.2.1"
description = "CI/CD gate that reads the current APIsec detection state for an application/instance and applies CVSS-severity / error-count thresholds, without triggering a new scan."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Gavin Hensley" }]
dependencies = [
    "requests>=2.32.3",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
